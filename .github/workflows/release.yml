name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Smoke test (launch, stay alive, screenshot)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke\$name.png")
          }
          Shot "before"
          $p = Start-Process build\windows\x64\runner\Release\Winter.exe -PassThru
          Start-Sleep 25
          Shot "running"
          if ($p.HasExited) { throw "Winter exited early with code $($p.ExitCode)" }
          "Working set MB: {0:N1}" -f ($p.WorkingSet64 / 1MB)
          "CPU seconds after 25 s: {0:N2}" -f $p.TotalProcessorTime.TotalSeconds
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winter-windows-smoke
          path: smoke/*
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows\winter.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\Winter-$version-Windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: winter-windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winter-macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
