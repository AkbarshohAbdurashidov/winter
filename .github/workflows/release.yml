name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Repository variables WINTER_API_URL / WINTER_API_KEY enable accounts
      # and Pro (empty = free build). Both are public values.
      - run: flutter build windows --release --dart-define=WINTER_API_URL=${{ vars.WINTER_API_URL }} --dart-define=WINTER_API_KEY=${{ vars.WINTER_API_KEY }}
      - name: Smoke test (launch, stay alive, screenshot)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Add-Type -AssemblyName System.Drawing
          # BitBlt with CAPTUREBLT so layered (click-through) windows are included.
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Grab {
            [DllImport("user32.dll")] static extern IntPtr GetDC(IntPtr h);
            [DllImport("user32.dll")] static extern int ReleaseDC(IntPtr h, IntPtr dc);
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int i);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint flags);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X, Y; }
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT p);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern IntPtr GetAncestor(IntPtr h, uint flags);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("gdi32.dll")] static extern bool BitBlt(IntPtr d, int x, int y, int w, int h, IntPtr s, int sx, int sy, int op);
            public static void Blit(IntPtr dst, int w, int h) {
              IntPtr src = GetDC(IntPtr.Zero);
              BitBlt(dst, 0, 0, w, h, src, 0, 0, 0x00CC0020 | 0x40000000);
              ReleaseDC(IntPtr.Zero, src);
            }
          }
          "@
          function Shot($name) {
            $w = [Grab]::GetSystemMetrics(0); $h = [Grab]::GetSystemMetrics(1)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $hdc = $g.GetHdc(); [Grab]::Blit($hdc, $w, $h); $g.ReleaseHdc($hdc); $g.Dispose()
            $bmp.Save((Join-Path (Get-Location) "smoke\$name.png")); $bmp.Dispose()
          }
          # PW_RENDERFULLCONTENT (2) also captures DirectComposition content.
          function Window($name, $hwnd) {
            $r = New-Object Grab+RECT; [Grab]::GetWindowRect($hwnd, [ref]$r) | Out-Null
            $w = $r.Right - $r.Left; $h = $r.Bottom - $r.Top
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $hdc = $g.GetHdc(); [Grab]::PrintWindow($hwnd, $hdc, 2) | Out-Null; $g.ReleaseHdc($hdc); $g.Dispose()
            $bmp.Save((Join-Path (Get-Location) "smoke\$name.png")); $bmp.Dispose()
          }
          Shot "before"
          $diag = Join-Path (Get-Location) "smoke\diagnostics.json"
          $p = Start-Process build\windows\x64\runner\Release\Winter.exe -ArgumentList "--diagnostics","`"$diag`"" -PassThru
          Start-Sleep 25
          Shot "running"
          Start-Sleep 30
          Shot "running-55s"
          $hwnd = [Grab]::FindWindow([NullString]::Value, "Winter")
          "Overlay HWND: $hwnd"
          if ($hwnd -ne [IntPtr]::Zero) { Window "overlay-printwindow" $hwnd }
          Get-Content $diag
          # Click-through check: with the cursor away from any snow, the window
          # under the screen centre must not be ours.
          [Grab]::SetCursorPos(3, 300) | Out-Null
          Start-Sleep 1
          $pt = New-Object Grab+POINT; $pt.X = 512; $pt.Y = 384
          $under = [Grab]::WindowFromPoint($pt)
          $cls = New-Object System.Text.StringBuilder 256
          [Grab]::GetClassName($under, $cls, 256) | Out-Null
          $root = [Grab]::GetAncestor($under, 2)
          "Window under centre: $under class=$cls root=$root overlay=$hwnd"
          if ($hwnd -ne [IntPtr]::Zero -and $root -eq $hwnd) { throw "Overlay is not click-through" }
          if ($p.HasExited) { throw "Winter exited early with code $($p.ExitCode)" }
          "Working set MB: {0:N1}" -f ($p.WorkingSet64 / 1MB)
          "CPU seconds after 55 s: {0:N2}" -f $p.TotalProcessorTime.TotalSeconds
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winter-windows-smoke
          path: smoke/*
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows\winter.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\Winter-$version-Windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: winter-windows
          path: dist/*

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build functions
        working-directory: firebase/functions
        run: npm ci && npm run build
      - name: End-to-end test (Firebase emulators)
        run: |
          printf 'TELEGRAM_BOT_TOKEN=test-token\nTELEGRAM_WEBHOOK_SECRET=local-telegram-secret\n' > firebase/functions/.secret.local
          printf 'PORTAL_URL=http://localhost:5173\nTELEGRAM_API=http://127.0.0.1:8765\nTELEGRAM_CHAT_ID=1000\nADMIN_EMAILS=boot-admin@example.com\nTELEGRAM_ROUTES=other=http://127.0.0.1:8765/route/other\n' > firebase/functions/.env.local
          npx -y firebase-tools@15.36.0 emulators:exec --only auth,firestore,functions --project demo-winter "python3 firebase/tests/e2e.py"
      - name: Build web portal
        working-directory: portal
        run: npm ci && npm run build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: scripts/build_macos_dmg.sh
        env:
          WINTER_API_URL: ${{ vars.WINTER_API_URL }}
          WINTER_API_KEY: ${{ vars.WINTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: winter-macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winter-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: winter-macos
          path: dist
      # Fixed names, so the website can link to
      # releases/latest/download/<name> (a direct download, no GitHub page).
      - name: Name files for "latest" links
        run: |
          cd dist
          mv Winter-*-macOS.dmg Winter-macOS.dmg
          mv Winter-*-Windows-Setup.exe Winter-Windows-Setup.exe
          mv Winter-*-Windows-portable.zip Winter-Windows-portable.zip
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: Winter ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
